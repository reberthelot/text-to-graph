[project]
name = "keyboards-text2graph"
version = "0.1.0"
description = "Text-to-graph over the Keyboards Wikibase: keyboard texts -> linked JSON-LD (FastAPI + CampusAI LLM)"
requires-python = ">=3.11"
# Runtime dependencies of the text2graph service. Every imported package is
# listed: no reliance on transitive installs (GUIDE section 1).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",                    # CampusAI LLM calls (+ scripts/fetch_catalogue.py)
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    # Explicit: Settings(env_file=".env") reads .env through python-dotenv.
    "python-dotenv>=0.21.0",
]

[dependency-groups]
# The evaluation frontend (src/app) runs in its own container.
frontend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.5",
    "python-dotenv>=0.21.0",
    "jinja2>=3.1",                    # HTML templating of the UI
    "rdflib>=7.0",                    # JSON-LD -> RDF triples for the scoring
]
# The test suite imports both applications (and scores with the frontend's rdflib).
dev = [
    "pytest>=8.0",
    { include-group = "frontend" },
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Docstring examples in src/ are run as tests too (--doctest-modules).
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
filterwarnings = [
    # Third-party deprecations we cannot act on (rdflib's JSON-LD parser, Starlette).
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
    "ignore:Code. _mock_name is not defined:UserWarning",
]
markers = [
    "bonus: harder behaviour beyond the baseline (deselect with -m 'not bonus')",
    "live: calls the real CampusAI LLM (skipped if unreachable, or with --no-live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Same rule set as the global default config (a project config replaces it).
select = ["E", "F", "I", "UP", "B", "NPY", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter
